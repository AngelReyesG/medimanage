spring.application.name=backend
# Configuración de la conexión a MySQL en Clever Cloud

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Configuración de JWT
jwt.secret = ${JWT_SECRET}
jwt.expiration = 86400000

#Limitar el pool de conexiones
spring.datasource.hikari.maximum-pool-size=2

# Forzar logs detallados del ruteo web y de la serialización de Jackson
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.com.fasterxml.jackson=DEBUG
